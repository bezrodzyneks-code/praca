# Lokalna baza: docker compose up -d
# Pliki z ./db wykonają się automatycznie przy pierwszym starcie (kolejność alfabetyczna).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kc
      POSTGRES_PASSWORD: kc_password
      POSTGRES_DB: krolestwo
    ports:
      - "5432:5432"   # baza tylko lokalnie, nie w sieci
    volumes:
      - kc_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  kc_data:
